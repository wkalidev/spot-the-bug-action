name: "Spot the Bug"
description: "Scan Solidity files changed in a pull request with Slither and post one sticky summary comment."
author: "wkalidev"

branding:
  icon: "shield"
  color: "green"

inputs:
  github-token:
    description: "Token used to list PR files and post the summary comment."
    required: false
    default: ${{ github.token }}
  working-directory:
    description: "Root of the Solidity project (Foundry or Hardhat), relative to the repository root."
    required: false
    default: "."
  solc-version:
    description: "Solidity compiler version installed and selected with solc-select."
    required: false
    default: "0.8.24"
  fail-on:
    description: "Fail the job if a finding at or above this severity exists in changed files: high, medium, low or none."
    required: false
    default: "high"
  slither-args:
    description: "Extra arguments passed to slither."
    required: false
    default: ""

outputs:
  findings-count:
    description: "Number of High, Medium and Low findings in changed files."
    value: ${{ steps.scan.outputs.findings-count }}
  high-count:
    description: "Number of High findings in changed files."
    value: ${{ steps.scan.outputs.high-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Slither and solc
      shell: bash
      env:
        SOLC_VERSION: ${{ inputs.solc-version }}
      run: |
        python -m pip install --disable-pip-version-check --quiet "slither-analyzer==0.11.6" "solc-select==1.2.0"
        solc-select install "$SOLC_VERSION"
        solc-select use "$SOLC_VERSION"

    - name: Run Spot the Bug
      id: scan
      shell: bash
      env:
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_WORKING-DIRECTORY: ${{ inputs.working-directory }}
        INPUT_FAIL-ON: ${{ inputs.fail-on }}
        INPUT_SLITHER-ARGS: ${{ inputs.slither-args }}
      run: node "${{ github.action_path }}/dist/index.js"
